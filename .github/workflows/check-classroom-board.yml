name: Check classroom board URL
on:
  push:
    branches: [main]
    paths:
      - 'board/index.html'
      - '.github/workflows/check-classroom-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public URL and approved source
        run: |
          mkdir -p /tmp/classroom-check
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil,subprocess,tempfile,time,urllib.request
          url='https://kimsenglish.github.io/board/'
          expected='7f9e55151546216ada0545e2d8494e31aecb048171e5249a11e0fc566ace8ff9'
          out=pathlib.Path('/tmp/classroom-check')
          report={'url':url,'success':False}
          for attempt in range(24):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ClassroomBoardDeploymentCheck'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      raw=response.read()
                      report.update(status=response.status,final_url=response.url,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                  if report['sha256']==expected:
                      report['success']=True
                      break
              except Exception as error:
                  report['last_error']=str(error)
              time.sleep(3)
          (out/'verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          assert report['success'], report
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          if chrome:
              with tempfile.TemporaryDirectory() as profile:
                  result=subprocess.run([chrome,'--headless=new','--no-sandbox','--disable-dev-shm-usage','--user-data-dir='+profile,'--window-size=1440,1000','--virtual-time-budget=2000','--dump-dom','--screenshot='+str(out/'editor.png'),url],capture_output=True,text=True,timeout=45)
                  (out/'rendered.html').write_text(result.stdout)
                  clock=re.search(r'<time[^>]*id="clockTime"[^>]*>(\d{2}:\d{2})</time>',result.stdout)
                  report['browser_clock']=clock.group(1) if clock else None
                  report['browser_messages_rendered']='class="msg-item' in result.stdout
                  assert clock and report['browser_messages_rendered'], 'Browser did not render board'
          else:
              report['browser_check']='Browser binary not available; HTTP and source verification passed'
          (out/'verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-board-live-check
          path: /tmp/classroom-check/
          retention-days: 1
