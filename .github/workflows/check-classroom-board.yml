name: Check classroom board URL
on:
  push:
    branches: [main]
    paths:
      - 'board/index.html'
      - '.github/workflows/check-classroom-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public URL and approved source
        run: |
          mkdir -p /tmp/classroom-check
          python3 - <<'PY'
          import hashlib,html,json,pathlib,re,shutil,subprocess,tempfile,time,urllib.request
          url='https://kimsenglish.github.io/board/'
          source=pathlib.Path('board/index.html').read_bytes()
          expected=hashlib.sha256(source).hexdigest()
          seed_match=re.search(r'<script id="starter-data" type="application/json">(.*?)</script>',source.decode('utf-8'),re.S)
          seed=json.loads(seed_match.group(1)) if seed_match else {}
          check_url=url+'?check='+expected[:16]
          out=pathlib.Path('/tmp/classroom-check')
          report={'url':url,'success':False}
          for attempt in range(36):
              try:
                  req=urllib.request.Request(check_url,headers={'Cache-Control':'no-cache','User-Agent':'ClassroomBoardDeploymentCheck'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      raw=response.read()
                      report.update(status=response.status,final_url=response.url,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                  if report['sha256']==expected:
                      report['success']=True
                      break
              except Exception as error:
                  report['last_error']=str(error)
              time.sleep(3)
          (out/'verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          assert report['success'], report
          chrome=shutil.which('google-chrome') or shutil.which('chromium')
          assert chrome, 'A browser is required for the published board check'
          with tempfile.TemporaryDirectory() as profile:
              result=subprocess.run([chrome,'--headless=new','--no-sandbox','--disable-dev-shm-usage','--user-data-dir='+profile,'--window-size=1440,1000','--virtual-time-budget=2000','--dump-dom','--screenshot='+str(out/'editor.png'),check_url],capture_output=True,text=True,timeout=45)
              (out/'rendered.html').write_text(result.stdout)
              clock=re.search(r'<time[^>]*id="clockTime"[^>]*>(\d{2}:\d{2})</time>',result.stdout)
              report['browser_clock']=clock.group(1) if clock else None
              report['browser_messages_rendered']='class="msg-item' in result.stdout
              report['fixed_memo_controls_rendered']='id="fixedMemoInput"' in result.stdout and 'id="tab-memo"' in result.stdout
              assert clock and report['browser_messages_rendered'] and report['fixed_memo_controls_rendered'], 'Browser did not render the upgraded board'
              if seed.get('publishedRevision') and seed.get('board'):
                  settings=seed['board']
                  message=re.search(r'<p\b[^>]*id="stageMessage"[^>]*>(.*?)</p>',result.stdout,re.S)
                  notice=re.search(r'<span\b[^>]*id="stageNotice"[^>]*>(.*?)</span>',result.stdout,re.S)
                  stage=re.search(r'<div\b[^>]*id="stage"[^>]*>',result.stdout)
                  assert message and notice and stage, 'Published board UI is missing'
                  message_text=html.unescape(re.sub(r'<[^>]+>','',message.group(1)))
                  notice_text=html.unescape(re.sub(r'<[^>]+>','',notice.group(1)))
                  report['published_revision']=seed['publishedRevision']
                  report['default_message']=message_text
                  report['default_notice']=notice_text
                  report['default_point_style']=settings['pointStyle']
                  assert message_text==settings['messages'][0]['text'], 'Fresh device sees a different message'
                  assert notice_text==settings['notice'], 'Fresh device sees a different notice'
                  assert 'data-point="'+settings['pointStyle']+'"' in stage.group(0), 'Point style differs'
                  report['published_defaults_verified']=True
          (out/'verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-board-live-check
          path: /tmp/classroom-check/
          retention-days: 3
