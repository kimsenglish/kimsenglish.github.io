name: Verify classroom board
on:
  push:
    branches: [main]
    paths:
      - 'board/app-v7.b64'
      - '.github/workflows/prepare-classroom-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect classroom board
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, re, json, subprocess, traceback
          report=[]
          try:
              source=pathlib.Path('board/app-v7.b64').read_text().strip()
              report.append('Base64 length: '+str(len(source)))
              raw=gzip.decompress(base64.b64decode(source,validate=True))
              html=raw.decode('utf-8')
              pathlib.Path('board/index.html').write_bytes(raw)
              report.append('Decoded bytes: '+str(len(raw)))
              report.append('SHA256: '+hashlib.sha256(raw).hexdigest())
              report.append('Title: '+str(re.findall(r'<title>(.*?)</title>',html)))
              required=['교실 보드','starter-data','presentBtn','shareBtn','localStorage','warmwise.classroom.v2','클로버','하트','exportHTML']
              for word in required:
                  report.append(word+': '+str(word in html))
              for i,(attrs,script) in enumerate(re.findall(r'<script([^>]*)>([\s\S]*?)</script>',html,re.I)):
                  if 'application/json' in attrs:
                      json.loads(script)
                  else:
                      f=pathlib.Path('/tmp')/('board-check-'+str(i)+'.js')
                      f.write_text(script)
                      result=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                      report.append('JavaScript '+str(i)+': '+str(result.returncode)+' '+result.stderr)
          except Exception:
              report.append(traceback.format_exc())
          pathlib.Path('board/verification.txt').write_text('\n'.join(report))
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-board-source
          path: board/
          retention-days: 1
