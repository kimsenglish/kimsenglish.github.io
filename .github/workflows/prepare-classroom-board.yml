name: Publish verified classroom board
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-classroom-board.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify exact approved v7 source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, subprocess, zlib
          folder=pathlib.Path('board')
          prefix=zlib.decompressobj(31).decompress(base64.b64decode((folder/'app-v7.b64').read_text(),validate=True))
          suffix=''.join((folder/f'transfer-{i}.b64').read_text().strip() for i in range(1,5))
          raw=prefix+lzma.decompress(base64.b64decode(suffix,validate=True))
          assert len(raw)==119515, 'Source length mismatch'
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='7f9e55151546216ada0545e2d8494e31aecb048171e5249a11e0fc566ace8ff9', 'Original source mismatch'
          html=raw.decode('utf-8')
          assert html.rstrip().endswith('</html>')
          for word in ['교실 보드','presentBtn','shareBtn','warmwise.classroom.v2','클로버','하트','exportHTML']:
              assert word in html, 'Missing component: '+word
          for i,(attrs,script) in enumerate(re.findall(r'<script([^>]*)>([\s\S]*?)</script>',html,re.I)):
              if 'application/json' in attrs:
                  json.loads(script)
              else:
                  f=pathlib.Path('/tmp')/f'board-check-{i}.js'
                  f.write_text(script)
                  subprocess.run(['node','--check',str(f)],check=True)
          (folder/'index.html').write_bytes(raw)
          pathlib.Path('/tmp/board-verification.txt').write_text('Approved original bytes: '+str(len(raw))+'\nSHA256: '+digest+'\nHTML and JavaScript syntax validation passed.\n')
          print(pathlib.Path('/tmp/board-verification.txt').read_text())
          PY
      - name: Commit approved HTML without changing existing homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add board/index.html
          git diff --cached --quiet || git commit -m 'Serve approved classroom board v7 directly as HTML'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-board-verified
          path: |
            board/index.html
            /tmp/board-verification.txt
          retention-days: 1
