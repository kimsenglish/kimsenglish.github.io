<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>교실 보드 · 김가영어학원</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#252c34;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}main{max-width:32rem;padding:2rem;text-align:center}h1{font-size:1.6rem;letter-spacing:-.04em}p{line-height:1.8;color:#68727e}button{border:0;border-radius:.7rem;padding:.85rem 1.3rem;background:#2558e8;color:white;font:inherit;cursor:pointer}</style>
</head>
<body>
<main><h1>교실 보드</h1><p id="status" role="status">시계와 메시지 화면을 열고 있어요.</p><button id="retry" hidden onclick="location.reload()">다시 열기</button><noscript><p>JavaScript를 허용한 브라우저에서 열어 주세요.</p></noscript></main>
<script>
(async()=>{
 try {
  if(typeof DecompressionStream==='undefined') throw new Error('browser');
  const paths=['v7.part1.txt','v7.part2.txt','v7.part3.txt','v7.part4.txt'];
  const lengths=[12988,12988,10651,2333];
  const pieces=await Promise.all(paths.map(async path=>{const r=await fetch(new URL(path,location.href),{cache:'no-cache',credentials:'omit'});if(!r.ok)throw new Error('network');return r.text();}));
  const bytes=Uint8Array.from(atob(pieces.map((piece,i)=>piece.slice(0,lengths[i])).join('').replace(/\s/g,'')),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buffer=await new Response(stream).arrayBuffer();
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buffer)),b=>b.toString(16).padStart(2,'0')).join('');
  if(digest!=='7f9e55151546216ada0545e2d8494e31aecb048171e5249a11e0fc566ace8ff9')throw new Error('integrity');
  const html=new TextDecoder('utf-8',{fatal:true}).decode(buffer);
  document.open();document.write(html);document.close();
 }catch(error){
  const status=document.getElementById('status');
  if(status)status.textContent=error.message==='browser'?'최신 Chrome, Safari 또는 Edge에서 이 주소를 열어 주세요.':'화면을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.';
  const retry=document.getElementById('retry');if(retry)retry.hidden=false;
  console.error('Classroom board loading failed:',error);
 }
})();
</script>
</body>
</html>
